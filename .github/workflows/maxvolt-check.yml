name: MaxVolt Flutter validation
on:
  pull_request:
    branches: [app-sector-31]
  push:
    branches: [codex/maxvolt-orbit, codex/maxvolt-identity]
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin refs/tags/3.47.4:refs/tags/3.47.4
          git -C "$RUNNER_TEMP/flutter" checkout --detach 9584c6713b324636289d067944a46fd6b49df14b
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maxvolt-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
